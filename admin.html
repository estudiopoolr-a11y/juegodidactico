<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Protocolo</title>
<style>
  body { font-family: monospace; background: #222; color: #fff; padding: 20px; max-width: 1000px; margin: 0 auto; }
  .btn { padding: 10px 20px; background: #444; color: #fff; border: none; cursor: pointer; font-size: 16px; margin: 5px; }
  .btn:hover { background: #666; }
  .btn:disabled { background: #333; cursor: not-allowed; }
  .game-code { font-size: 24px; font-weight: bold; color: #0f0; margin: 20px 0; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #555; padding: 8px; text-align: left; }
  th { background: #333; }
  .status { font-size: 18px; margin: 10px 0; }
  .chat-log { background: #1a1a1a; padding: 10px; height: 150px; overflow-y: scroll; margin-top: 20px; font-size: 12px; border: 1px solid #444; }
  .chat-entry { margin-bottom: 5px; color: #bbb; }
  .chat-entry.from-player { color: #88f; }
</style>
</head>
<body>
<h1>Panel de Control - El Protocolo de Austeridad</h1>

<!-- Crear juego -->
<div id="createSection">
  <h2>1. Crear un nuevo juego</h2>
  <input type="text" id="newGameCodeInput" placeholder="Código del juego (ej: JUEGO-123)" style="padding: 10px; font-size: 16px; width: 300px;" />
  <button class="btn" onclick="createGame()">Crear Juego</button>
  <div id="gameCodeDisplay" class="game-code" style="display:none;"></div>
</div>

<!-- Control del juego -->
<div id="controlSection" style="display:none; margin-top: 30px;">
  <h2>2. Control del Juego: <span id="currentAdminGameCode"></span></h2>
  <div class="status" id="status">Esperando...</div>
  
  <button class="btn" id="startBtn" onclick="startGame()">Iniciar Juego</button>
  <button class="btn" id="nextPhaseBtn" onclick="nextPhase()">Siguiente Fase</button>
  <button class="btn" onclick="resetGame()">Reiniciar Juego</button>
  
  <div class="status">Pool colectivo: <span id="poolScore">0</span> / 1000</div>
  
  <h3>Jugadores Conectados (<span id="playerCount">0</span>/30)</h3>
  <table id="playersTable">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Puntos</th>
        <th>Voto</th>
        <th>Pareja</th>
      </tr>
    </thead>
    <tbody id="playersList">
    </tbody>
  </table>

  <h3>Registro de Chat</h3>
  <div id="chatLog" class="chat-log"></div>

</div>

<script type="module">
  import { GameDB, db } from './firebase.js';
  import { doc, getDoc, updateDoc, onSnapshot, collection, query, orderBy, limit, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

  let currentGameCode = null;
  let unsubscribeGame = null;
  let unsubscribeChat = null;

  const createSection = document.getElementById('createSection');
  const controlSection = document.getElementById('controlSection');
  const newGameCodeInput = document.getElementById('newGameCodeInput');
  const gameCodeDisplay = document.getElementById('gameCodeDisplay');
  const currentAdminGameCode = document.getElementById('currentAdminGameCode');
  const statusDiv = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const nextPhaseBtn = document.getElementById('nextPhaseBtn');
  const poolScoreSpan = document.getElementById('poolScore');
  const playersList = document.getElementById('playersList');
  const playerCountSpan = document.getElementById('playerCount');
  const chatLogDiv = document.getElementById('chatLog');

  async function createGame() {
    const gameCode = newGameCodeInput.value.trim();
    if (!gameCode) { alert('Ingresa un código de juego'); return; }

    try {
      await GameDB.createGame(gameCode);
      setupGameControls(gameCode);
      alert('Juego creado. Comparte el código con los estudiantes.');
    } catch (error) {
      alert('Error: ' + error.message);
    }
  }

  function setupGameControls(gameCode) {
    currentGameCode = gameCode;
    createSection.style.display = 'none';
    controlSection.style.display = 'block';
    gameCodeDisplay.textContent = `URL del juego: ${window.location.origin}/player.html`;
    gameCodeDisplay.style.display = 'block';
    currentAdminGameCode.textContent = gameCode;

    unsubscribeGame = GameDB.subscribeToGame(gameCode, (gameData) => {
      updateAdminView(gameData);
    });
    
    unsubscribeChat = GameDB.subscribeToAllChat(gameCode, (messages) => {
        chatLogDiv.innerHTML = '';
        messages.forEach(msg => {
            const p = document.createElement('p');
            p.className = `chat-entry ${msg.from.startsWith('J') ? 'from-player' : ''}`; // Para estilizar mensajes de jugadores
            p.textContent = `[${msg.timestamp.toDate().toLocaleTimeString()}] ${msg.from} ${msg.to ? `-> ${msg.to}` : ''}: ${msg.message}`;
            chatLogDiv.appendChild(p);
        });
        chatLogDiv.scrollTop = chatLogDiv.scrollHeight;
    });
  }

  function updateAdminView(gameData) {
    if (!gameData) return;

    const phases = ['NEGOCIACIÓN', 'VOTACIÓN', 'AUDITORÍA', 'RESULTADOS'];
    const phaseName = gameData.phase !== undefined ? phases[gameData.phase] : 'Esperando...';
    
    statusDiv.textContent = 
      `Ronda: ${gameData.round}/5 | Fase: ${phaseName} | Tiempo: ${gameData.timeLeft}s | Ejecutando: ${gameData.running ? 'SÍ' : 'NO'}`;

    poolScoreSpan.textContent = gameData.poolScore || 0;

    // Actualizar tabla de jugadores
    let rows = '';
    let connectedPlayersCount = 0;
    const playersData = gameData.players || {};
    const playerCodes = Object.keys(playersData).sort(); // Ordenar por código

    playerCodes.forEach(code => {
      const p = playersData[code];
      connectedPlayersCount++;
      const partnerCode = gameData.pairs ? gameData.pairs.find(pair => pair.p1 === code || pair.p2 === code)?.[(pair.p1 === code ? 'p2' : 'p1')] || '-' : '-';
      rows += `<tr>
        <td>${code}</td>
        <td>${p.name || '-'}</td>
        <td>${p.score || 0}</td>
        <td>${p.vote || '-'}</td>
        <td>${partnerCode}</td>
      </tr>`;
    });
    playersList.innerHTML = rows;
    playerCountSpan.textContent = connectedPlayersCount;

    // Habilitar/deshabilitar botones
    startBtn.disabled = gameData.running; // Solo se puede iniciar si no está corriendo
    nextPhaseBtn.disabled = !gameData.running; // Solo se puede avanzar si está corriendo
  }

  async function startGame() {
    if (currentGameCode) {
      await GameDB.startGame(currentGameCode, Object.keys(gameData.players || {}).length); // Pasa el número de jugadores conectados
    }
  }

  async function nextPhase() {
    if (currentGameCode) {
      await GameDB.nextPhase(currentGameCode);
    }
  }

  async function resetGame() {
    if (currentGameCode && confirm('¿Seguro que quieres reiniciar el juego? Se perderán todos los datos.')) {
      await GameDB.createGame(currentGameCode);
      alert('Juego reiniciado.');
    }
  }

  // Intentar reconectar si hay un juego activo en Firebase (si el admin recarga la página)
  window.onload = async () => {
      // Esto es para cuando el admin recarga la página, que se vuelva a enganchar al juego si existía uno.
      // Por simplicidad, asumimos que el admin recordará el código del juego. O se puede guardar en localStorage.
      // Por ahora, el admin debe crear o re-ingresar el código del juego para volver a controlarlo.
  };
</script>
</body>
</html>
