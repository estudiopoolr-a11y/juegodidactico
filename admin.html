<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Protocolo</title>
<style>
  body { font-family: monospace; background: #222; color: #fff; padding: 20px; max-width: 1000px; margin: 0 auto; }
  .btn { padding: 10px 20px; background: #444; color: #fff; border: none; cursor: pointer; font-size: 16px; margin: 5px; }
  .btn:hover { background: #666; }
  .btn:disabled { background: #333; cursor: not-allowed; }
  .game-code { font-size: 24px; font-weight: bold; color: #0f0; margin: 20px 0; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #555; padding: 8px; text-align: left; }
  th { background: #333; }
</style>
</head>
<body>
<h1>Panel de Control - El Protocolo de Austeridad</h1>

<div id="createSection">
  <h2>1. Crear un nuevo juego</h2>
  <input type="text" id="newGameCodeInput" placeholder="Código (ej: JUEGO-123)" style="padding: 10px; font-size: 16px; width: 300px;" />
  <button class="btn" id="createBtn">Crear Juego</button>
</div>

<div id="controlSection" style="display:none; margin-top: 30px;">
  <h2>2. Control del Juego: <span id="currentAdminGameCode"></span></h2>
  <div id="status" style="font-size: 18px; margin: 10px 0;">Esperando...</div>
  
  <button class="btn" id="startBtn">Iniciar Juego</button>
  <button class="btn" id="nextPhaseBtn" disabled>Siguiente Fase</button>
  
  <div style="font-size: 18px; margin: 10px 0;">Pool colectivo: <span id="poolScore">0</span> / 1000</div>
  
  <h3>Jugadores Conectados (<span id="playerCount">0</span>)</h3>
  <table>
    <thead><tr><th>Código</th><th>Nombre</th><th>Puntos</th><th>Voto</th><th>Pareja</th></tr></thead>
    <tbody id="playersList"></tbody>
  </table>

  <h3>Registro de Chat</h3>
  <div id="chatLog" style="background:#111; padding:10px; height:150px; overflow-y:scroll; border:1px solid #444;"></div>
</div>

<script type="module">
  import { GameDB } from './firebase.js';

  let currentGameCode = null;

  document.getElementById('createBtn').onclick = async () => {
    const code = document.getElementById('newGameCodeInput').value.trim();
    if (!code) return alert('Ingresa un código');
    await GameDB.createGame(code);
    currentGameCode = code;
    document.getElementById('createSection').style.display = 'none';
    document.getElementById('controlSection').style.display = 'block';
    document.getElementById('currentAdminGameCode').textContent = code;

    GameDB.subscribeToGame(code, (game) => {
      if (!game) return;
      const phases = ['NEGOCIACIÓN', 'VOTACIÓN', 'AUDITORÍA', 'RESULTADOS'];
      document.getElementById('status').textContent = `Ronda: ${game.round}/5 | Fase: ${phases[game.phase] || 'Listo'} | Estado: ${game.running ? 'Corriendo' : 'Detenido'}`;
      document.getElementById('poolScore').textContent = game.poolScore || 0;
      
      let rows = '';
      const pKeys = Object.keys(game.players || {});
      document.getElementById('playerCount').textContent = pKeys.length;
      pKeys.forEach(k => {
        const p = game.players[k];
        rows += `<tr><td>${p.code}</td><td>${p.name}</td><td>${p.score}</td><td>${p.vote || '-'}</td><td>${p.partnerId || '-'}</td></tr>`;
      });
      document.getElementById('playersList').innerHTML = rows;

      document.getElementById('startBtn').disabled = game.running;
      document.getElementById('nextPhaseBtn').disabled = !game.running;
    });

    GameDB.subscribeToAllChat(code, (msgs) => {
      const log = document.getElementById('chatLog');
      log.innerHTML = '';
      msgs.forEach(m => {
        const p = document.createElement('div');
        p.textContent = `[${m.from} -> ${m.to}]: ${m.message}`;
        log.appendChild(p);
      });
      log.scrollTop = log.scrollHeight;
    });
  };

  document.getElementById('startBtn').onclick = () => GameDB.startGame(currentGameCode);
  document.getElementById('nextPhaseBtn').onclick = () => GameDB.nextPhase(currentGameCode);
</script>
</body>
</html>
