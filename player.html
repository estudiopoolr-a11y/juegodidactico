<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo de Austeridad - Estudiante</title>
<style>
  body { font-family: monospace; background: #f0f0f0; padding: 20px; max-width: 500px; margin: 0 auto; }
  .container { background: #fff; padding: 20px; border: 1px solid #ccc; }
  input { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
  .btn { width: 100%; padding: 15px; margin: 10px 0; background: #e0e0e0; border: 1px solid #999; font-size: 18px; cursor: pointer; }
  .btn:hover { background: #d0d0d0; }
  .timer { font-size: 32px; font-weight: bold; text-align: center; margin: 20px 0; }
  .hidden { display: none; }
  .chat-box { border: 1px solid #ccc; height: 100px; overflow-y: scroll; padding: 5px; margin-bottom: 10px; background: #f9f9f9; }
  .chat-input-area { display: flex; }
  .chat-input { flex-grow: 1; padding: 5px; }
  .chat-send-btn { padding: 5px 10px; margin-left: 5px; width: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>El Protocolo</h1>

  <div id="connectScreen">
    <p>Código del juego:</p>
    <input type="text" id="gameCodeInput" placeholder="Ej: JUEGO-123" />
    <p>Tu código (01-30):</p>
    <input type="text" id="playerCodeInput" placeholder="01" maxlength="2" />
    <p>Tu nombre:</p>
    <input type="text" id="playerNameInput" placeholder="Nombre" />
    <button class="btn" id="joinBtn">Conectar</button>
    <p id="errorMsg" style="color: red;"></p>
  </div>

  <div id="gameScreen" class="hidden">
    <p>Jugador: <span id="playerCodeDisplay"></span> (<span id="playerNameDisplay"></span>)</p>
    <div class="timer" id="timer">00:00</div>
    <p id="roundInfo"></p>
    <p id="phaseInfo"></p>
    <p id="partnerInfo"></p>

    <div id="chatSection" class="hidden">
      <h3>Chat con pareja</h3>
      <div class="chat-box" id="chatBox"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="Mensaje..." />
        <button class="btn chat-send-btn" id="sendChatBtn">Enviar</button>
      </div>
    </div>

    <div id="actions"></div>
    <p>Tu puntaje: <span id="scoreDisplay">0</span></p>
    <p>Pool colectivo: <span id="poolDisplay">0</span> / 1000</p>
  </div>

  <div id="resultScreen" class="hidden">
    <h2>Resultados Finales</h2>
    <p>Puntaje: <span id="finalScore">0</span></p>
    <p>Pool: <span id="finalPool">0</span> / 1000</p>
    <p>Ganador: <span id="winner">-</span></p>
  </div>
</div>

<script type="module">
  import { GameDB } from './firebase.js';

  let currentGameCode = null;
  let currentPlayerCode = null;
  let currentPartnerCode = null;

  document.getElementById('joinBtn').onclick = async () => {
    const gameCode = document.getElementById('gameCodeInput').value.trim();
    const playerCode = document.getElementById('playerCodeInput').value.trim();
    const playerName = document.getElementById('playerNameInput').value.trim();

    if (!gameCode || !playerCode || !playerName) {
      document.getElementById('errorMsg').textContent = 'Completa todos los campos';
      return;
    }

    try {
      await GameDB.joinGame(gameCode, playerCode, playerName);
      currentGameCode = gameCode;
      currentPlayerCode = playerCode;

      document.getElementById('connectScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('playerCodeDisplay').textContent = playerCode;
      document.getElementById('playerNameDisplay').textContent = playerName;

      GameDB.subscribeToGame(gameCode, (game) => {
        if (!game) return;
        document.getElementById('timer').textContent = `${Math.floor(game.timeLeft/60).toString().padStart(2,'0')}:${(game.timeLeft%60).toString().padStart(2,'0')}`;
        document.getElementById('roundInfo').textContent = `Ronda: ${game.round}/5`;
        
        const phases = ['NEGOCIACIÓN', 'VOTACIÓN', 'AUDITORÍA', 'RESULTADOS'];
        document.getElementById('phaseInfo').textContent = `Fase: ${phases[game.phase] || 'Esperando'}`;

        // Pareja y chat
        if (game.phase === 0 && game.pairs) {
          const myPair = game.pairs.find(p => p.p1 === currentPlayerCode || p.p2 === currentPlayerCode);
          if (myPair) {
            currentPartnerCode = (myPair.p1 === currentPlayerCode) ? myPair.p2 : myPair.p1;
            const partner = game.players[currentPartnerCode];
            document.getElementById('partnerInfo').textContent = partner ? `Pareja: ${partner.name} (${partner.code})` : 'Buscando...';
            document.getElementById('chatSection').classList.remove('hidden');
          }
        } else {
          document.getElementById('partnerInfo').textContent = '';
          document.getElementById('chatSection').classList.add('hidden');
        }

        // Acciones
        const act = document.getElementById('actions');
        if (game.phase === 1 && game.running) {
          act.innerHTML = `<button class="btn" id="coopBtn">COOPERAR</button><button class="btn" id="betBtn">DESERTAR</button>`;
          document.getElementById('coopBtn').onclick = () => GameDB.submitVote(currentGameCode, currentPlayerCode, 'coop');
          document.getElementById('betBtn').onclick = () => GameDB.submitVote(currentGameCode, currentPlayerCode, 'bet');
        } else {
          act.innerHTML = '<p>Esperando fase de votación...</p>';
        }

        if (game.players && game.players[currentPlayerCode]) {
          document.getElementById('scoreDisplay').textContent = game.players[currentPlayerCode].score || 0;
        }
        document.getElementById('poolDisplay').textContent = game.poolScore || 0;

        if (!game.running && game.round >= 5) {
          document.getElementById('gameScreen').classList.add('hidden');
          document.getElementById('resultScreen').classList.remove('hidden');
          document.getElementById('finalScore').textContent = game.players[currentPlayerCode]?.score || 0;
          document.getElementById('finalPool').textContent = game.poolScore || 0;
          document.getElementById('winner').textContent = (game.poolScore >= 1000) ? 'TODOS' : 'Ninguno';
        }
      });

      GameDB.subscribeToChat(gameCode, currentPlayerCode, (msgs) => {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        msgs.forEach(m => {
          const p = document.createElement('p');
          p.textContent = `${m.from}: ${m.message}`;
          box.appendChild(p);
        });
        box.scrollTop = box.scrollHeight;
      });

    } catch (e) {
      document.getElementById('errorMsg').textContent = e.message;
    }
  };

  document.getElementById('sendChatBtn').onclick = async () => {
    const txt = document.getElementById('chatInput').value.trim();
    if (txt && currentGameCode && currentPlayerCode && currentPartnerCode) {
      await GameDB.sendChatMessage(currentGameCode, currentPlayerCode, currentPartnerCode, txt);
      document.getElementById('chatInput').value = '';
    }
  };
</script>
</body>
</html>
