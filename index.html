<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL PROTOCOLO — Mesa 3D Inmersiva</title>
<style>
:root{--bg:#050508;--panel:rgba(10,15,30,0.9);--accent:#00f2ff;--sec:#ff00ea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:#050508;color:#fff;overflow:hidden;width:100vw;height:100vh}
#canvas3d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* Chat inferior envolvente */
#chat-bar{
    position:fixed;bottom:0;left:0;width:100%;height:30vh;
    background:var(--panel);border-top:2px solid var(--accent);
    padding:20px;z-index:10;display:flex;flex-direction:column;gap:10px;
}
#chat-window{flex:1;overflow-y:auto;font-size:16px;line-height:1.6;color:#ccc}
.bubble-ia{color:var(--accent);margin-bottom:10px}
.bubble-user{color:#fff;text-align:right;margin-bottom:10px}
.bubble-sys{color:#ffcc00;font-style:italic;margin-bottom:10px}

/* Controles */
#controls{display:flex;gap:10px;padding-top:10px}
.btn{padding:12px;background:#1a1a2e;color:#fff;border:1px solid var(--accent);cursor:pointer;flex:1;font-family:inherit;font-size:14px}
.btn-main{background:var(--accent);color:#000;font-weight:bold}
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="chat-bar">
    <div id="chat-window"></div>
    <div id="controls">
        <button class="btn" onclick="Game.ask('Beneficio')">¿Qué gano?</button>
        <button class="btn" onclick="Game.ask('Confianza')">¿Por qué confiar?</button>
        <button class="btn" onclick="Game.ask('Truco')">¿Cuál es la trampa?</button>
        <button class="btn btn-main" onclick="Game.toVote()">VOTAR</button>
    </div>
</div>
<script>
/* ===========================================================
   MOTOR DE CÁMARA (Lerp suave)
   =========================================================== */
const C3D = {
    canvas: null, gl: null,
    cam: {x:0, y:2, z:5, tx:0, ty:2, tz:5},
    
    // Función de interpolación lineal para movimiento suave
    lerp(a, b, n) { return (1 - n) * a + n * b; },

    updateCam() {
        this.cam.x = this.lerp(this.cam.x, this.cam.tx, 0.05);
        this.cam.y = this.lerp(this.cam.y, this.cam.ty, 0.05);
        this.cam.z = this.lerp(this.cam.z, this.cam.tz, 0.05);
    },

    moveTo(idx) {
        const angles = [0, 72, 144, 216, 288];
        const rad = angles[idx] * Math.PI / 180;
        this.cam.tx = Math.sin(rad) * 4;
        this.cam.ty = 2;
        this.cam.tz = Math.cos(rad) * 4;
        console.log("Cámara enfocando al Mando:", idx);
    }
};

// --- LÓGICA DE JUEGO ---
const Game={
    st:{round:1,score:0},
    init(){ C3D.init(); this.startRound(); },
    startRound(){
        C3D.moveTo(this.st.round-1);
        document.getElementById('chat-window').innerHTML = `<div class="bubble-ia"><b>MANDO ${this.st.round}:</b> Inicia el monólogo...</div>`;
    },
    ask(t){ alert("Pregunta: " + t); },
    toVote(){ alert("Votación..."); }
};
window.onload = () => Game.init();
</script>
</body>
</html>
