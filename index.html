<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PROTOCOLO_AUSTERIDAD_v9</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; padding: 10px; }
        .box { border: 1px solid #333; padding: 15px; max-width: 400px; margin: auto; }
        .btn { border: 1px solid #00ff41; background: transparent; color: #00ff41; padding: 10px; width: 100%; margin: 5px 0; cursor: pointer; text-transform: uppercase; }
        .btn:hover { background: #00ff41; color: #000; }
        .chat-box { height: 150px; border: 1px solid #222; overflow-y: auto; padding: 5px; font-size: 12px; margin-bottom: 10px; }
        .msg { margin-bottom: 8px; }
        .ia { color: #ff00ff; }
        .user { color: #00ffff; text-align: right; }
        #tooltip { position: absolute; background: #222; border: 1px solid #555; padding: 5px; font-size: 10px; display: none; }
    </style>
</head>
<body>
    <div class="box" id="screen-welcome">
        <h1>PROTOCOLO.EXE</h1>
        <p>AGENTE, TU RENDIMIENTO ES DEFICIENTE. LA AUSTERIDAD ES LA ÚNICA LEY.</p>
        <input type="text" id="name" placeholder="ID_AGENTE" style="background:#000; color:#0f0; border:1px solid #333; width:100%; padding:5px;">
        <button class="btn" onclick="Game.init()">EJECUTAR_PROTOCOLO</button>
    </div>

    <div id="screen-play" class="hidden">
        <div id="stats" style="font-size: 10px;">RONDA: 1 | PUNTOS: 0 | TIEMPO: 15:00</div>
        <div id="ia-name" style="color: #ff00ff; font-weight: bold;">MANDO: ???</div>
        <div class="chat-box" id="chat"></div>
        <div id="actions"></div>
    </div>

    <script>
        const IAS = [
            { name: "BUROCRATA_GRIS", intro: "NO ME HAGAS PERDER EL TIEMPO, AGENTE. ¿QUÉ QUIERES?", 
              resp: {"Confianza": "La confianza es para los débiles que no saben auditar.", "Meta": "Tu meta es irrelevante, el sistema decide.", "Puntos": "Los puntos son basura burocrática.", "Riesgo": "El riesgo es que no seas reemplazable."},
              logic: () => "coop" },
            { name: "REPARTIDOR_VENGATIVO", intro: "TE VIGILO. SI ME TRAICIONAS, TE QUEDARÁS EN CERO.", 
              resp: {"Confianza": "Confiar en alguien como tú es un error de sistema.", "Meta": "Tu meta es mi beneficio.", "Puntos": "No te los mereces.", "Riesgo": "El riesgo es que desaparezcas del padrón."},
              logic: (h) => h.length && h[h.length-1].userVote === 'betray' ? 'betray' : 'coop' },
            { name: "ALGORITMO_CAOS", intro: "VAMOS A JUGAR A LA RUINA. ¿PREPARADO?", 
              resp: {"Confianza": "La moneda siempre cae del lado que más duele.", "Meta": "1000 puntos es un sueño de novato.", "Puntos": "Todo es humo, Agente.", "Riesgo": "El riesgo es el factor constante."},
              logic: () => Math.random() > 0.5 ? 'coop' : 'betray' },
            { name: "AUDITOR_SANGRIENTO", intro: "DETECTO DEFICIENCIAS EN TU EXPEDIENTE. DESERTA Y MORIRÁS.", 
              resp: {"Confianza": "Cinismo puro. Tu registro está manchado.", "Meta": "Tu promoción fue denegada.", "Puntos": "Obediencia ciega, Agente.", "Riesgo": "El impuesto del 15% es solo el principio."},
              logic: () => 'betray' },
            { name: "DIRECTOR_ABSOLUTO", intro: "LLEGASTE AL FINAL. ¿CREES QUE TIENES LO QUE HACE FALTA?", 
              resp: {"Confianza": "La confianza expiró en la ronda 1.", "Meta": "Eres un número más en mi lista.", "Puntos": "Son MÍOS.", "Riesgo": "Multiplicador de austeridad activo."},
              logic: () => 'betray' }
        ];

        const Game = {
            state: { round: 1, score: 0, history: [] },
            init() {
                const n = document.getElementById('name').value;
                if(!n) return alert("ID_REQUERIDO");
                document.getElementById('screen-welcome').classList.add('hidden');
                document.getElementById('screen-play').classList.remove('hidden');
                this.startRound();
            },
            startRound() {
                const ia = IAS[this.state.round-1];
                document.getElementById('ia-name').textContent = "MANDO: " + ia.name;
                this.addMsg(ia.name, ia.intro, 'ia');
                document.getElementById('actions').innerHTML = `
                    <button class="btn" onclick="Game.ask('Confianza')">¿CONFIANZA?</button>
                    <button class="btn" onclick="Game.ask('Meta')">¿META?</button>
                    <button class="btn" onclick="Game.ask('Puntos')">¿PUNTOS?</button>
                    <button class="btn" onclick="Game.ask('Riesgo')">¿RIESGO?</button>
                    <hr>
                    <button class="btn" onclick="Game.vote('coop')">COOPERAR</button>
                    <button class="btn" onclick="Game.vote('betray')">DESERTAR</button>
                `;
            },
            ask(topic) {
                const ia = IAS[this.state.round-1];
                this.addMsg("AGENTE", topic + "?", 'user');
                this.addMsg(ia.name, ia.resp[topic], 'ia');
            },
            addMsg(w, m, t) {
                const c = document.getElementById('chat');
                c.innerHTML += `<div class="msg ${t}"><b>${w}:</b> ${m}</div>`;
                c.scrollTop = c.scrollHeight;
            },
            vote(v) {
                const ia = IAS[this.state.round-1];
                const iaV = ia.logic(this.state.history);
                const pts = (v==='coop' && iaV==='coop') ? 10 : (v==='betray' && iaV==='coop') ? 25 : 0;
                this.state.score += pts;
                this.state.history.push({ userVote: v });
                alert(`RESULTADO: TÚ(${v}) VS IA(${iaV}). PUNTOS: ${pts}.`);
                if(this.state.round < 5) { this.state.round++; this.startRound(); }
                else alert("PROTOCOLO FINALIZADO. SCORE: " + this.state.score);
            }
        };
    </script>
</body>
</html>
