<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Protocolo de Austeridad</title>
<style>
  :root {
    --bg: #111;
    --card: #1c1c1c;
    --border: #333;
    --text: #ccc;
    --accent: #007acc;
    --font: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .box {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: 4px;
    text-align: center;
  }
  h1 { font-size: 18px; text-transform: uppercase; color: #fff; margin-bottom: 8px; letter-spacing: 1px; }
  p { font-size: 13px; color: #888; margin-bottom: 24px; line-height: 1.4; }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    background: #222;
    border: 1px solid var(--border);
    color: #fff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: background 0.1s ease, border-color 0.1s ease;
  }
  .btn:hover { background: #2d2d2d; border-color: var(--accent); }
  .btn.primary { background: var(--accent); }
  .btn.primary:hover { background: #1c97ea; }
  .note { font-size: 11px; color: #666; margin-top: 16px; border-top: 1px solid var(--border); pt: 12px; }
</style>
</head>
<body>
<div class="box">
  <h1>El Protocolo de Austeridad</h1>
  <p>Simulador cognitivo de teoría de juegos, negociación y dilemas de confianza.</p>

  <a href="player.html" class="btn primary">Entrar como Estudiante</a>
  <a href="admin.html" class="btn">Panel del Instructor</a>

  <div class="note">Versión Asíncrona 2.0 &bull; Cero bloqueos de red &bull; SENA CBI Palmira</div>
</div>
</body>
</html>
